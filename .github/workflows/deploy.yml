name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Variabelen via Settings → Secrets and variables → Actions → Variables (niet geheim; ze komen in de publieke site).
# Testversie: SITE_URL=https://aioplus.github.io en BASE_PATH=/aioplus-site (standaard hieronder).
# Live op aioplus.ai: SITE_URL=https://www.aioplus.ai en BASE_PATH=/ (zie README, "Live op aioplus.ai").
env:
  SITE_URL: ${{ vars.SITE_URL || 'https://aioplus.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/aioplus-site' }}
  # Adres van de AIO-chat; leeg = het vaste adres in src/scripts/aio-chat.ts.
  PUBLIC_AIO_CHAT_URL: ${{ vars.PUBLIC_AIO_CHAT_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
