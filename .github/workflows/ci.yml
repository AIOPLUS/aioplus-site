name: CI

# Controleert elke pull request met dezelfde stappen als npm run check.
# De deploy (deploy.yml) draait dezelfde check nog eens op main voordat de site live gaat.
on:
  pull_request:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://aioplus.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/aioplus-site' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
